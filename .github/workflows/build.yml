name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true
      - run: go test ./...
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: andreasholmq/homelab/.github/workflows/publish-first-party-app.yml@main
    with:
      app-name: preview-publisher
      source-sha: ${{ github.sha }}
      dokploy-compose-id: zy25WpN3zG9QspfrQAYBn
      infisical-identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
      infisical-project-slug: release-preview-publisher
      tailscale-client-id: ${{ vars.TAILSCALE_RELEASE_CLIENT_ID }}
      tailscale-audience: ${{ vars.TAILSCALE_RELEASE_AUDIENCE }}
      deploy: false
      worker-required: false
